<div class="history-panel">
  <h3>Move History</h3>
  <p *ngIf="moves.length === 0" class="empty">No moves yet.</p>
  <table *ngIf="moves.length > 0">
    <thead>
      <tr>
        <th>Move</th>
        <th>Player</th>
        <th>Position</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let move of moves">
        <td>{{ move.moveNumber }}</td>
        <td>{{ move.player }}<span *ngIf="move.isComputerMove"> (computer)</span></td>
        <td>{{ positionLabel(move) }}</td>
      </tr>
    </tbody>
  </table>
</div>
